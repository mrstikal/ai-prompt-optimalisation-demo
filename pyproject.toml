[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "dspy-prompt-optimization-lab"
version = "0.1.0"
description = "Standalone DSPy/GEPA lab for reviewing Czech precious-metals articles."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "dspy==3.4.1",
  "gepa[dspy]==0.1.4",
  "litellm>=1.65.8",
  "pydantic>=2.11,<3",
  "streamlit==1.66.0",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/dspy_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not live'"
markers = [
  "live: requires explicit authorization, provider credentials, and a confirmed budget",
]
